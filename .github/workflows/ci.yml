name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.50.0'
      - run: just test
      - run: just wasm

  oracles:
    runs-on: macos-15
    env:
      TRUEPEAK_REQUIRE_ORACLES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: extractions/setup-just@v3
        with:
          just-version: '1.50.0'
      - run: brew install ffmpeg
      - uses: actions/cache@v4
        with:
          path: fixtures/ebu
          key: ebu-loudness-v05-60d022fdac47ad0b
      - run: just validate
